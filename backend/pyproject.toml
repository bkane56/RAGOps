[project]
name = "ragops-backend"
version = "0.1.0"
description = "RAGOps Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.1.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = [
  "app/tests/*",
  "app/infrastructure/database/migrations/*",
  "app/providers/embeddings/ollama.py",
  "app/providers/llm/ollama.py",
  "app/providers/vector_store/pgvector.py",
  "app/api/routes/documents.py",
  "app/api/routes/ask.py",
  "app/api/routes/compare.py",
  "app/services/ingestion/service.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
