services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragops
      POSTGRES_PASSWORD: ragops
      POSTGRES_DB: ragops
    ports:
      - "5432:5432"
    volumes:
      - ragops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragops -d ragops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ragops_pgdata:
